plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.170'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://mvn.devos.one/snapshots" } // Registrate
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    exclusiveContent { // Optional Sable Companion API (compileOnly — not required at runtime)
        forRepository {
            maven {
                url = "https://maven.ryanhcode.dev/releases"
                name = "RyanHCode Maven"
            }
        }
        filter {
            includeGroup("dev.ryanhcode.sable")
            includeGroup("dev.ryanhcode.sable-companion")
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

//minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
//minecraft.accessTransformers.entry public net.minecraft.client.Minecraft textureManager # textureManager

// Default run configurations.
// These can be tweaked, removed, or duplicated as needed.
runs {
    // applies to all the run configs below
    configureEach {
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
        systemProperty 'forge.logging.console.level', 'debug'

        // NeoForge 1.21.1 GameTestHooks reads neoforge.* (the MDK still sets forge.*)
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        systemProperty 'neoforge.enableGameTest', 'true'

        modSource project.sourceSets.main
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        systemProperty 'neoforge.gameTestServer', 'true'
        argument '--nogui'
    }

    data {
        // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
        // workingDirectory project.file('run-data')

        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

tasks.configureEach { task ->
    if (task.name == 'runGameTestServer') {
        // GameTestServer persists the Overworld SavedData under runs/; wipe it so
        // MigratedChunks from a previous local run cannot skip merge assertions.
        task.doFirst {
            def worldDir = layout.projectDirectory.dir('runs/gameTestServer/world').asFile
            if (worldDir.exists()) {
                delete worldDir
            }
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Specify the version of Minecraft to use.
    // Depending on the plugin applied there are several options. We will assume you applied the userdev plugin as shown above.
    // The group for userdev is net.neoforged, the module name is neoforge, and the version is the same as the neoforge version.
    // You can however also use the vanilla plugin (net.neoforged.gradle.vanilla) to use a version of Minecraft without the neoforge loader.
    // And its provides the option to then use net.minecraft as the group, and one of; client, server or joined as the module name, plus the game version as version.
    // For all intends and purposes: You can treat this dependency as if it is a normal library you would use.
    implementation "net.neoforged:neoforge:${neo_version}"

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // Optional Create: Aeronautics / Sable compat.
    // compileOnly: present on the compile classpath so SableWorldSpace can call the
    // Companion API, but NOT packaged and NOT required to run. At runtime the
    // classes come from Sable's own Jar-in-Jar when (and only when) Sable is installed.
    // Set enable_sable_compat_compile=false if maven.ryanhcode.dev is unreachable;
    // SableWorldSpace will then fail to compile until the artifact is restored.
    if (project.findProperty('enable_sable_compat_compile') != 'false') {
        compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}") {
            transitive = false
        }
    }

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            create_version_range   : create_version_range,
            create_version         : create_version,
            ponder_version         : ponder_version,
            flywheel_version       : flywheel_version,
            registrate_version     : registrate_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('jar').configure {
    // GameTests stay on the main compile classpath for runGameTestServer, but
    // are not shipped in the published artifact.
    exclude 'com/mealuet/create_originium_industry/gametest/**'
}

tasks.register('assertNoSableInJar') {
    group = 'verification'
    description = 'Fails if the published jar packages Sable or Sable Companion classes.'
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def zf = new java.util.zip.ZipFile(jarFile)
        try {
            def hits = []
            zf.entries().each { entry ->
                def n = entry.name.replace('\\', '/')
                if (n.startsWith('dev/ryanhcode/sable/') || n.contains('sable-companion')) {
                    hits << n
                }
            }
            if (!hits.isEmpty()) {
                throw new GradleException("Published jar packages Sable classes: ${hits}")
            }
            def hasWorldSpace = zf.getEntry('com/mealuet/create_originium_industry/compat/WorldSpace.class') != null
            def hasBridge = zf.getEntry('com/mealuet/create_originium_industry/compat/SableWorldSpace.class') != null
            def leakedTests = zf.getEntry('com/mealuet/create_originium_industry/gametest/OriDustGameTests.class') != null
            if (!hasWorldSpace || !hasBridge) {
                throw new GradleException("Published jar is missing WorldSpace bridge classes")
            }
            if (leakedTests) {
                throw new GradleException("Published jar should not contain GameTest classes")
            }
            logger.lifecycle("Verified ${jarFile.name} does not package Sable/Companion (WorldSpace bridge present, GameTests excluded).")
        } finally {
            zf.close()
        }
    }
}

tasks.named('check').configure {
    dependsOn 'assertNoSableInJar'
    dependsOn 'runGameTestServer'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register('bumpVersion') {
    description 'Bumps mod_version in gradle.properties, commits, pushes, and tags.'
    group 'versioning'

    doLast {
        def execOps = project.getServices().get(ExecOperations.class)

        // Get the bump type from command line (e.g., -PbumpType=patch)
        String bumpType = project.hasProperty('bumpType') ? project.property('bumpType') : 'patch'

        // Load current version from gradle.properties
        def props = new Properties()
        def gradlePropsFile = file('gradle.properties')
        if (!gradlePropsFile.exists()) {
            throw new GradleException("gradle.properties file not found")
        }
        props.load(gradlePropsFile.newReader("UTF-8"))

        def currentVersion = props.getProperty('mod_version')
        if (!currentVersion) {
            throw new GradleException("mod_version not found in gradle.properties")
        }

        // Parse and bump version
        String newVersion

        if (currentVersion.endsWith('-dev')) {
            def baseVersion = currentVersion.replace('-dev', '')
            def versionParts = baseVersion.tokenize('.').collect { it.toInteger() }
            if (versionParts.size() != 3) {
                throw new GradleException("Invalid version format (expected x.y.z-dev): $currentVersion")
            }
            def (major, minor, patch) = versionParts

            switch (bumpType.toLowerCase()) {
                case 'patch':
                    newVersion = "${major}.${minor}.${patch + 1}-dev"
                    break
                case 'minor':
                    newVersion = "${major}.${minor + 1}.0-dev"
                    break
                case 'major':
                    newVersion = "${major + 1}.0.0-dev"
                    break
                case 'release':
                    newVersion = baseVersion // Release version removes '-dev'
                    break
                default:
                    throw new GradleException("Invalid bumpType: $bumpType. Use patch, minor, major, or release.")
            }
        } else {
            throw new GradleException("Current version $currentVersion is not a dev version (must end with -dev) for bumping patch/minor/major. Use 'release' to tag it or manually edit gradle.properties.")
        }

        // Update gradle.properties only if the version changed
        if (newVersion != currentVersion) {
            props.setProperty('mod_version', newVersion)
            gradlePropsFile.withWriter('UTF-8') { writer -> props.store(writer, null) }
            println "Updated mod_version to $newVersion"

            execOps.exec {
                commandLine 'git', 'add', 'gradle.properties'
            }
            execOps.exec {
                commandLine 'git', 'commit', '-m', "chore(version): bump version to $newVersion"
            }
            execOps.exec {
                commandLine 'git', 'push', 'origin', 'HEAD'
            }

            def tagName = "v${newVersion}"
            println "Creating and pushing tag $tagName..."
            execOps.exec {
                commandLine 'git', 'tag', '-a', tagName, '-m', "Release $tagName"
            }
            execOps.exec {
                commandLine 'git', 'push', 'origin', tagName
            }
            println "Created and pushed tag $tagName"
        } else {
            println "Version remains $currentVersion."
        }
    }
}
